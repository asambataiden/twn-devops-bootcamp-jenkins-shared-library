name: Shared Library CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/library-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Gradle tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Verify Gradle tests
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports-java-${{ matrix.java }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
